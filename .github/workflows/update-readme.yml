name: Update profile README

on:
  # раз в сутки в 12:00 по Москве (в cron время UTC, Москва = UTC+3)
  schedule:
    - cron: "0 9 * * *"
  # кнопка «Run workflow» вручную
  workflow_dispatch:
  # при изменении самого скрипта или этого файла
  push:
    paths:
      - "scripts/update_readme.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # карточка языков (тёмная тема, сам репозиторий профиля не считаем)
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=github_dark&border_color=30363d&exclude_repo=${{ github.repository_owner }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain README.md profile/top-langs.svg)" ]; then
            git add README.md profile/top-langs.svg
            git commit -m "Update profile README"
            git push
          else
            # README не менялся. GitHub отключает расписание, если в репозитории
            # 60 дней тишины, поэтому раз в 50 дней делаем пустой коммит
            last=$(git log -1 --format=%ct)
            now=$(date +%s)
            if [ $(( (now - last) / 86400 )) -ge 50 ]; then
              git commit --allow-empty -m "Keep scheduled workflow active"
              git push
            else
              echo "Nothing to commit"
            fi
          fi
